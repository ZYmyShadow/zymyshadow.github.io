<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON 格式化 · 工具合集 · 修仙藏书阁</title>
  <meta name="description" content="在线 JSON 格式化、校验、压缩与排序工具，纯本地处理，数据不出浏览器。">
  <meta property="og:image" content="https://zymyshadow.github.io/assets/images/og-cover.jpg">
  <meta property="og:title" content="JSON 格式化 · 修仙藏书阁">
  <meta property="og:description" content="在线格式化、校验、压缩 JSON 数据，支持键名排序。">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c2472e'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='white' font-family='serif'%3E%E8%97%8F%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/tool-page.css">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('xzc-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div id="navbar"></div>

  <header class="page-hero reveal">
    <div>
      <p class="page-hero-kicker mono">TOOL · 实用工具</p>
      <h1 class="page-hero-title">JSON 格式化</h1>
      <p class="page-hero-lead">在线格式化、校验、压缩 JSON 数据<span class="hero-sub"> —— 纯本地处理，数据不出浏览器</span></p>
    </div>
    <span class="seal seal-hero" aria-hidden="true">{ }</span>
  </header>

  <main class="tool-page">
    <a class="back-link" href="index.html"><span class="arr">←</span> 返回工具合集</a>

    <div class="tool-workspace reveal">
      <div class="tool-cols">
        <div class="tool-field">
          <label class="tool-label" for="j-src">输入 JSON<span class="lbl-extra">在左侧粘贴或编辑</span></label>
          <textarea class="tool-textarea" id="j-src" placeholder='{"name":"修仙藏书阁","tags":["工具","JSON"],"ok":true}' spellcheck="false"></textarea>
        </div>
        <div class="tool-field">
          <label class="tool-label" for="j-out">输出结果<span class="lbl-extra" id="j-meta"></span></label>
          <pre class="tool-output empty" id="j-out">格式化后的结果将显示在这里…</pre>
        </div>
      </div>

      <div class="tool-bar">
        <div class="tool-seg" id="j-indent" role="group" aria-label="缩进">
          <button type="button" data-indent="2" class="active">2 空格</button>
          <button type="button" data-indent="4">4 空格</button>
          <button type="button" data-indent="\t">Tab</button>
        </div>
        <button type="button" class="tool-btn tool-btn-primary" id="j-format">格式化</button>
        <button type="button" class="tool-btn" id="j-minify">压缩</button>
        <button type="button" class="tool-btn" id="j-sort">排序键</button>
        <button type="button" class="tool-btn" id="j-validate">校验</button>
        <button type="button" class="tool-btn" id="j-copy">复制结果</button>
        <button type="button" class="tool-btn tool-btn-ghost" id="j-sample">示例</button>
        <button type="button" class="tool-btn tool-btn-ghost" id="j-clear">清空</button>
      </div>

      <div class="tool-status" id="j-status"></div>
    </div>

    <div class="tool-foot">
      <a class="tool-btn tool-btn-ghost" href="index.html">查看全部工具 →</a>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/theme-toggle.js"></script>
  <script src="../assets/js/tool-common.js"></script>
  <script>
    (function () {
      'use strict';
      var src = document.getElementById('j-src');
      var out = document.getElementById('j-out');
      var meta = document.getElementById('j-meta');
      var status = document.getElementById('j-status');
      var indent = '2';
      var lastResult = '';

      var SAMPLE = '{\n  "name": "修仙藏书阁",\n  "url": "https://zymyshadow.github.io",\n  "tags": ["工具", "JSON", "前端"],\n  "stats": {\n    "articles": 19,\n    "tools": 8,\n    "online": true\n  },\n  "created": "2026-07-29"\n}';

      function setStatus(type, msg) {
        status.className = 'tool-status show ' + type;
        status.innerHTML = msg;
      }
      function clearStatus() { status.className = 'tool-status'; status.innerHTML = ''; }

      function getIndent() {
        return indent === '\\t' ? '\t' : parseInt(indent, 10);
      }

      function parseInput() {
        var text = src.value.trim();
        if (!text) { throw new Error('输入为空，请先粘贴 JSON 文本。'); }
        return JSON.parse(text);
      }

      function sortKeys(obj) {
        if (Array.isArray(obj)) return obj.map(sortKeys);
        if (obj && typeof obj === 'object') {
          return Object.keys(obj).sort().reduce(function (acc, k) {
            acc[k] = sortKeys(obj[k]);
            return acc;
          }, {});
        }
        return obj;
      }

      function render(formatted, note) {
        lastResult = formatted;
        out.className = 'tool-output';
        out.textContent = formatted;
        var bytes = new Blob([formatted]).size;
        meta.textContent = note + ' · ' + formatted.length + ' 字符 / ' + bytes + ' B';
      }

      function doFormat(sort) {
        clearStatus();
        try {
          var obj = parseInput();
          if (sort) obj = sortKeys(obj);
          render(JSON.stringify(obj, null, getIndent()), sort ? '已按键名排序' : '已格式化');
          setStatus('ok', '✓ JSON 合法，' + (sort ? '已按键名排序并' : '') + '格式化成功。');
        } catch (e) {
          out.className = 'tool-output is-err';
          out.textContent = e.message;
          lastResult = '';
          meta.textContent = '';
          setStatus('err', '✗ 解析失败：<span class="mono">' + TC.esc(e.message) + '</span>');
        }
      }

      function doMinify() {
        clearStatus();
        try {
          var obj = parseInput();
          render(JSON.stringify(obj), '已压缩');
          setStatus('ok', '✓ JSON 合法，已压缩为单行。');
        } catch (e) {
          setStatus('err', '✗ 解析失败：<span class="mono">' + TC.esc(e.message) + '</span>');
        }
      }

      function doValidate() {
        clearStatus();
        try {
          var obj = parseInput();
          var type = Array.isArray(obj) ? '数组' : (obj && typeof obj === 'object' ? '对象' : typeof obj);
          setStatus('ok', '✓ JSON 合法，根节点类型：<span class="mono">' + type + '</span>。');
        } catch (e) {
          setStatus('err', '✗ 校验未通过：<span class="mono">' + TC.esc(e.message) + '</span>');
        }
      }

      document.getElementById('j-format').addEventListener('click', function () { doFormat(false); });
      document.getElementById('j-sort').addEventListener('click', function () { doFormat(true); });
      document.getElementById('j-minify').addEventListener('click', doMinify);
      document.getElementById('j-validate').addEventListener('click', doValidate);
      document.getElementById('j-copy').addEventListener('click', function () {
        if (!lastResult) { setStatus('err', '✗ 暂无结果可复制，请先格式化。'); return; }
        TC.copy(lastResult, this);
      });
      document.getElementById('j-sample').addEventListener('click', function () {
        src.value = SAMPLE;
        doFormat(false);
      });
      document.getElementById('j-clear').addEventListener('click', function () {
        src.value = '';
        out.className = 'tool-output empty';
        out.textContent = '格式化后的结果将显示在这里…';
        meta.textContent = '';
        lastResult = '';
        clearStatus();
        src.focus();
      });

      document.getElementById('j-indent').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-indent]');
        if (!btn) return;
        this.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        indent = btn.dataset.indent;
        if (lastResult) doFormat(false);
      });

      /* 快捷键：Ctrl/Cmd + Enter 格式化 */
      src.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          doFormat(false);
        }
      });
    })();
  </script>
</body>
</html>
