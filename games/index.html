<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏攻略 · 总入口 · 修仙藏书阁</title>
  <meta name="description" content="修仙藏书阁游戏攻略总入口：各游戏攻略专区、置顶攻略与分类导航。">
  <meta property="og:image" content="https://zymyshadow.github.io/assets/images/og-cover.jpg">
  <meta property="og:title" content="游戏攻略 · 总入口 · 修仙藏书阁">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c2472e'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='white' font-family='serif'%3E%E8%97%8F%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('xzc-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div id="navbar"></div>

  <header class="page-hero reveal">
    <div>
      <p class="page-hero-kicker mono">GAME GUIDES · 攻略总入口</p>
      <h1 class="page-hero-title">游戏攻略</h1>
      <p class="page-hero-lead">游戏专区 · 置顶攻略直达<span class="hero-sub"> —— 点击卡片进入对应专区，查看完整攻略列表</span></p>
    </div>
    <span class="seal seal-hero" aria-hidden="true">攻略</span>
  </header>

  <main class="hub-page">
    <div id="games-panels" class="game-panels">
      <div class="load-fail">正在加载游戏专区数据…</div>
    </div>

    <div class="ad-slot reveal" data-slot="games-1">广告位 · GOOGLE ADSENSE 预留</div>
  </main>

  <div id="footer"></div>

  <script src="../assets/js/render-list.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/theme-toggle.js"></script>
  <script>
    (function () {
      'use strict';
      var host = document.getElementById('games-panels');

      fetch('../data/games.json')
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (games) {
          /* 并行拉取每款游戏的攻略列表，提取置顶项 */
          return Promise.all(games.map(function (g) {
            return fetch(g.id + '/data/guides.json')
              .then(function (r) { return r.ok ? r.json() : []; })
              .catch(function () { return []; });
          })).then(function (guidesArr) {
            var pinnedByGame = {};
            games.forEach(function (g, i) {
              pinnedByGame[g.id] = (guidesArr[i] || [])
                .filter(function (x) { return x.pinned; })
                .slice(0, 4);
            });
            RL.renderGamePanels(host, games, pinnedByGame);
            RL.initReveal();
          });
        })
        .catch(function () {
          host.innerHTML =
            '<div class="load-fail">⚠ 游戏数据加载失败。<br>' +
            '<span class="mono">若为本地双击打开（file://），请改用本地静态服务器预览，例如：python -m http.server</span></div>';
        });
    })();
  </script>
</body>
</html>
