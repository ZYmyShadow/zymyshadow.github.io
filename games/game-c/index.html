<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏C 攻略专区 · 修仙藏书阁</title>
  <meta name="description" content="游戏C 游戏攻略专区：新手指南、角色攻略、BOSS 攻略、资源掉落，持续更新。">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c2472e'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='white' font-family='serif'%3E%E8%97%8F%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('xzc-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div id="navbar"></div>

  <header class="page-hero reveal">
    <div>
      <p class="page-hero-kicker mono">GAME C · 游戏专区</p>
      <h1 class="page-hero-title" id="game-title">游戏C</h1>
      <p class="page-hero-lead" id="game-desc">专区数据加载中…</p>
    </div>
    <span class="seal seal-hero" id="game-code" aria-hidden="true">叁</span>
  </header>

  <main class="hub-page">
    <a class="back-link" href="../index.html"><span class="arr">←</span> 返回攻略总入口</a>
    <div id="guide-box">
      <div class="load-fail">正在加载攻略列表…</div>
    </div>

    <div class="ad-slot reveal" data-slot="game-c-1">广告位 · GOOGLE ADSENSE 预留</div>
  </main>

  <div id="footer"></div>

  <script src="../../assets/js/render-list.js"></script>
  <script src="../../assets/js/components.js"></script>
  <script src="../../assets/js/theme-toggle.js"></script>
  <script>
    (function () {
      'use strict';
      var GAME_ID = 'game-c'; /* 复制本页面到新游戏时，只需改这一处和 <title> */
      var host = document.getElementById('guide-box');

      Promise.all([
        fetch('../../data/games.json').then(function (r) { return r.json(); }),
        fetch('data/guides.json').then(function (r) { return r.json(); })
      ])
        .then(function (res) {
          var games = res[0], guides = res[1];
          var g = null;
          games.forEach(function (x) { if (x.id === GAME_ID) g = x; });
          if (g) {
            document.getElementById('game-title').textContent = g.name;
            document.getElementById('game-desc').textContent = g.desc;
            document.getElementById('game-code').textContent = g.code || '叁';
            document.title = g.name + ' 攻略专区 · 修仙藏书阁';
          }
          RL.renderGuideHub(host, guides);
        })
        .catch(function () {
          host.innerHTML =
            '<div class="load-fail">⚠ 攻略数据加载失败。<br>' +
            '<span class="mono">若为本地双击打开（file://），请改用本地静态服务器预览，例如：python -m http.server</span></div>';
        });
    })();
  </script>
</body>
</html>
